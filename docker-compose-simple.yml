version: '3.8'

services:
  # MedCare AI CDSS Application (Standalone)
  medcare-ai:
    build: .
    container_name: medcare-ai-cdss
    ports:
      - "8505:8505"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-your-key-here}
      - PYTHONPATH=/app/src
      - STREAMLIT_SERVER_PORT=8505
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    networks:
      - medcare-network
    volumes:
      - ./patient_records:/app/patient_records:ro
      - ./data:/app/data:ro

networks:
  medcare-network:
    driver: bridge